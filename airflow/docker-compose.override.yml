# Monte le code (ingestion, rapports), le projet dbt et le stockage local dans
# les conteneurs Astro. Le code est en lecture seule : les conteneurs
# l'executent, ils ne le modifient jamais. `data/` est en lecture-ecriture :
# c'est la sortie (bronze, silver, gold, rapports PDF).
x-eco2mix-volumes: &eco2mix-volumes
  - ../ingestion:/usr/local/airflow/ingestion:ro
  - ../reporting:/usr/local/airflow/reporting:ro
  - ../dbt:/usr/local/airflow/dbt:ro
  - ../data:/usr/local/airflow/data:rw

services:
  scheduler:
    volumes: *eco2mix-volumes
  webserver:
    volumes: *eco2mix-volumes
  triggerer:
    volumes: *eco2mix-volumes
