[project]
name = "ou-brancher-mon-entreprise"
version = "0.1.0"
description = "Plateforme eCO2mix (RTE) en architecture medaillon et rapports mensuels carbone / Tempo"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    # requis par le client Python DuckDB pour rendre les TIMESTAMPTZ
    "pytz>=2024.1",
    "pydantic-settings>=2.2",
    # zoneinfo n'a pas de base de fuseaux sur Windows ni dans les images slim
    "tzdata>=2024.1",
]

[project.scripts]
ou-brancher = "ingestion.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-httpx>=0.30",
    "ruff>=0.6",
]
# Couches silver et gold (dbt/). Groupe séparé : dbt n'est pas nécessaire à
# l'ingestion, et tourne dans un environnement isolé dans l'image Airflow.
# >= 1.10 pour la syntaxe `arguments:` des tests de données.
dbt = [
    "dbt-duckdb>=1.10,<2",
]
# Rapport mensuel PDF (reporting/). Installé dans l'image Airflow via
# airflow/requirements.txt ; inutile pour l'ingestion seule.
report = [
    "matplotlib>=3.8",
    "reportlab>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion", "reporting"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH", "RUF"]
# Typographie française des textes du rapport (plages horaires « 6 h–22 h »).
allowed-confusables = ["–"]

[tool.pytest.ini_options]
testpaths = ["ingestion/tests"]
addopts = "-q --strict-markers"
