name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # Version d'Airflow alignee sur Astro Runtime 12.x.
  AIRFLOW_VERSION: "2.10.4"

jobs:
  lint-test:
    name: ruff + pytest + dbt build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # uv installe via pip : aucune action tierce, aucun credential.
      - name: Install uv
        run: pip install uv

      # Les groupes dbt et report activent les tests de bout en bout des
      # couches silver et gold et du rapport PDF, ignores sinon.
      - name: Install dependencies
        run: uv sync --group dev --group dbt --group report

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      # Les appels HTTP sont simules par pytest-httpx : le runner n'atteint
      # jamais l'API ODRE, et aucun secret n'est necessaire. dbt build tourne
      # sur une base DuckDB temporaire alimentee par des donnees synthetiques.
      - name: Tests
        run: uv run pytest

  dag-import:
    name: Airflow DAG import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Airflow and the ingestion package
        run: |
          pip install "apache-airflow==${AIRFLOW_VERSION}" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt"
          pip install -e .

      # Attrape les erreurs d'import du DAG sans avoir a demarrer Docker :
      # c'est la moitie automatisable du critere "astro dev start".
      - name: Import DAGs
        env:
          AIRFLOW__CORE__LOAD_EXAMPLES: "false"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          from airflow.models import DagBag

          bag = DagBag("airflow/dags", include_examples=False)
          if bag.import_errors:
              raise SystemExit(f"erreurs d'import : {bag.import_errors}")

          expected = {
              "eco2mix_hourly_ingest": {"extract", "load_bronze", "dbt_build", "freshness_check"},
              "eco2mix_monthly_consolidation": {"extract", "load_bronze", "dbt_build", "coverage_check"},
              "eco2mix_monthly_report": {"resolve_month", "extract_tempo", "load_tempo", "dbt_build", "generate_report"},
          }
          # Taches qui n'ouvrent pas DuckDB : hors du pool.
          hors_pool = {"extract", "resolve_month", "extract_tempo"}
          assert set(bag.dags) == set(expected), f"DAGs inattendus : {sorted(bag.dags)}"
          for dag_id, task_ids in expected.items():
              dag = bag.dags[dag_id]
              assert dag.max_active_runs == 1, f"{dag_id} : un seul run a la fois (writer DuckDB unique)"
              assert {task.task_id for task in dag.tasks} == task_ids, dag_id
              # Toute tache qui ecrit ou lit DuckDB passe par le pool a 1 slot.
              for task_id in task_ids - hors_pool:
                  assert dag.get_task(task_id).pool == "duckdb_writer", f"{dag_id}.{task_id}"
          # Le rapport se declenche a la demande, jamais sur planification.
          assert bag.dags["eco2mix_monthly_report"].schedule_interval is None
          print(f"OK : {len(bag.dags)} DAG(s)")
          PY
